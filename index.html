<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>planora</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div id="main">
        <!-- <nav>

        </nav> -->

        <section class="allelm">
            <div class="todo elem" id="0">
                <img src="https://i.pinimg.com/736x/99/bc/89/99bc892a5f873db3fb5808ef70fc7e54.jpg" alt="">
                <h2>Todo list</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://i.pinimg.com/1200x/60/8b/87/608b877b76cf4fa3f994f5716607d42c.jpg" alt="">
                <h2>Daily planner</h2>
            </div>
            <div class="pomo elem" id="2">
                <img src="https://i.pinimg.com/736x/dc/fb/e5/dcfbe56a97aca74128d9f75656ec9411.jpg" alt="">
                <h2>Pomodoro</h2>
            </div>
            <div class="moto elem" id="3">
                <img src="https://i.pinimg.com/1200x/ee/24/47/ee2447fbdffd8a35788f3f7f86d297aa.jpg" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://i.pinimg.com/736x/cd/de/da/cddeda77e5fdbd5a85ac40d5aba08f06.jpg" alt="">
                <h2>Goals</h2>
            </div>
        </section>

        <section class="fullelem todo-fullpg">
            <button class="back" id="0">
                <i class="ri-close-line"></i></button>
            <h1>Todo page</h1>
            <div class="todo-container">
                <div class="addTask">
                    <form>
                        <h3>Add Task</h3>
                        <input type="text" placeholder="Add a new task...">
                        <textarea placeholder="enter dets" name="" id=""></textarea>
                        <div class="important-container">
                            <input type="checkbox" id="check" name="important">
                            <label for="mark-important">Mark as important</label>
                        </div>
                        <button type="submit">Add</button>
                    </form>
                </div>
                <div class="alltask">
                    <div class="task">
                        <div class="task-details">
                            <h5>Complete React project </h5>
                            <p>Finish todo functionality and styling</p>
                        </div>
                        <button>complete </button>
                    </div>
                    
                </div>
            </div>
        </section>
        <section class="fullelem daily-fullpg">
            <button class="back" id="1">
                <i class="ri-close-line"></i></button>
            <h1>Daily planner</h1>
        </section>
        <section class="fullelem pomo-fullpg">
            <button class="back" id="2">
                <i class="ri-close-line"></i></button>
            <h1>Pomodoro</h1>
        </section>
        <section class="fullelem moto-fullpg">
            <button class="back" id="3">
                <i class="ri-close-line"></i></button>
            <h1>Motivation</h1>
        </section>
        <section class="fullelem goals-fullpg">
            <button class="back" id="4">
                <i class="ri-close-line"></i></button>
            <h1>Goals</h1>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
